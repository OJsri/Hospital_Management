<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f4f7fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: #111827;
            padding: 30px 20px;
            color: white;
        }

        .sidebar h2 {
            font-size: 24px;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: 500;
        }

        .sidebar a:hover {
            background: #2563eb;
            color: white;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
        }

        .top-bar {
            background: white;
            padding: 20px 30px;
            border-radius: 18px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .page-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>🏥 HMS</h2>

    <a href="/">Dashboard</a>
    <a href="/appointments/">Appointments</a>
    <a href="/patients/">Patients</a>
    <a href="/doctors/">Doctors</a>
    <a href="/medical-records/">Medical Records</a>
    <a href="/billing/">Billing</a>
</div>

<div class="main-content">

    <div class="top-bar">
        <h3 class="mb-0">
            Smart Hospital Management System
        </h3>
    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
