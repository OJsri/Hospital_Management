{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    ✏ Update Patient
</h1>

<div class="page-card">

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Patient ID</label>
            <input type="number"
                   class="form-control"
                   value="{{ patient.patient_id }}"
                   readonly>
        </div>

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text"
                   name="full_name"
                   class="form-control"
                   value="{{ patient.full_name }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Gender</label>
            <input type="text"
                   name="gender"
                   class="form-control"
                   value="{{ patient.gender }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Age</label>
            <input type="number"
                   name="age"
                   class="form-control"
                   value="{{ patient.age }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Blood Group</label>
            <input type="text"
                   name="blood_group"
                   class="form-control"
                   value="{{ patient.blood_group }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   value="{{ patient.phone }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="email"
                   class="form-control"
                   value="{{ patient.email }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Address</label>
            <input type="text"
                   name="address"
                   class="form-control"
                   value="{{ patient.address }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Emergency Contact</label>
            <input type="text"
                   name="emergency_contact"
                   class="form-control"
                   value="{{ patient.emergency_contact }}"
                   required>
        </div>

        <button class="btn btn-success w-100 p-3 rounded-4">
            Update Patient
        </button>

    </form>

</div>

{% endblock %}
