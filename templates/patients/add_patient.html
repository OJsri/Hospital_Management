{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    ➕ Add New Patient
</h1>

<div class="page-card">

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Patient ID</label>
            <input type="number" name="patient_id"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="full_name"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Gender</label>
            <input type="text" name="gender"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Age</label>
            <input type="number" name="age"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Blood Group</label>
            <input type="text" name="blood_group"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" name="phone"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Address</label>
            <input type="text" name="address"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Emergency Contact</label>
            <input type="text" name="emergency_contact"
                   class="form-control" required>
        </div>

        <button class="btn btn-primary w-100 p-3 rounded-4">
            Add Patient
        </button>

    </form>

</div>

{% endblock %}
